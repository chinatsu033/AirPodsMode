name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRPODSMODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AIRPODSMODE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret; release APK will be debug-signed."
          fi

      - name: Unit tests + release APK
        env:
          AIRPODSMODE_KEYSTORE_PASSWORD: ${{ secrets.AIRPODSMODE_KEYSTORE_PASSWORD }}
          AIRPODSMODE_KEY_ALIAS: ${{ secrets.AIRPODSMODE_KEY_ALIAS }}
          AIRPODSMODE_KEY_PASSWORD: ${{ secrets.AIRPODSMODE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AirPodsMode-${VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsMode-apk
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || { echo "AirPods Mode ${TAG}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk $PRE --title "AirPods Mode ${TAG}" --notes-file "$NOTES"
          fi
